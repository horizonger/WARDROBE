name: Build and publish WARDROBE

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      WARDROBE_APP_VERSION: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Stamp application version
        shell: powershell
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          @{ version = $version } | ConvertTo-Json | Set-Content version.json -Encoding utf8
          Get-Content version.json

      - name: Build WARDROBE
        shell: cmd
        run: pyinstaller --clean --noconfirm WARDROBE.spec

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup -y --no-progress
          $paths = @(
            "$env:ProgramFiles(x86)\Inno Setup 7\ISCC.exe",
            "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 7\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $paths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            $iscc = Get-ChildItem "C:\Program Files (x86)", "C:\Program Files" -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $iscc) {
            throw "ISCC.exe was not found after Inno Setup installation."
          }
          "ISCC_PATH=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: Build installer
        shell: powershell
        run: |
          if (Test-Path installer) { Remove-Item installer -Recurse -Force }
          New-Item -ItemType Directory -Path installer | Out-Null
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          & $env:ISCC_PATH "/DAppVersion=$version" "WARDROBE.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed with exit code $LASTEXITCODE."
          }
          $installer = Get-ChildItem "installer\WARDROBE-Setup-*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Installer was not created."
          }

      - name: Create SHA-256 checksum
        shell: powershell
        run: |
          $installer = Get-ChildItem "installer\WARDROBE-Setup-*.exe" | Select-Object -First 1
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($installer.Name)" | Set-Content "$($installer.FullName).sha256" -Encoding ascii

      - name: Publish GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = (Get-ChildItem "installer\WARDROBE-Setup-*.exe" | Select-Object -First 1).FullName
          $checksum = "$installer.sha256"
          gh release create $env:GITHUB_REF_NAME $installer $checksum --title "WARDROBE $env:GITHUB_REF_NAME" --generate-notes --verify-tag
