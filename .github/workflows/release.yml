name: Build and publish WARDROBE

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      WARDROBE_APP_VERSION: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build WARDROBE
        shell: cmd
        run: pyinstaller --clean --noconfirm WARDROBE.spec

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: cmd
        run: |
          if exist installer rmdir /s /q installer
          mkdir installer
          set VERSION=%GITHUB_REF_NAME:v=%
          iscc.exe /DAppVersion=%VERSION% WARDROBE.iss

      - name: Create SHA-256 checksum
        shell: powershell
        run: |
          $installer = Get-ChildItem installer\WARDROBE-Setup-*.exe | Select-Object -First 1
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($installer.Name)" | Set-Content "$($installer.FullName).sha256" -Encoding ascii

      - name: Publish GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = (Get-ChildItem installer\WARDROBE-Setup-*.exe | Select-Object -First 1).FullName
          $checksum = "$installer.sha256"
          gh release create $env:GITHUB_REF_NAME $installer $checksum --title "WARDROBE $env:GITHUB_REF_NAME" --generate-notes
